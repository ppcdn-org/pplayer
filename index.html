<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pplayer</title>
    <link rel="stylesheet" href="app.css?v=20261111-2">
</head>
<body>

<div id="controls">
    <div class="controls-row">
        <label for="appStreamInput">Stream:</label>
        <input type="text" id="appStreamInput" value="keyc0c021b8ef993bcc/B01-frontView/h264"
               placeholder="appId/streamName (optionally /h264 or /hevc)"
               title="Type appId/streamName to play your own stream. Append /h264 or /hevc to force the codec.">
        <span id="appStatus" title="Status"></span>
    </div>
    <div class="controls-row">
        <div class="ws-wrap">
            <span id="appWsStatus" class="ws-status" title="Signaling Status"></span>
            <label for="appQualitySelect">Quality:</label>
            <select id="appQualitySelect" disabled>
                <option value="auto">Auto (Waiting...)</option>
            </select>
        </div>

        <label for="appP2P" class="p2p-toggle"
               title="P2P: prefer a direct peer-to-peer connection to the publisher, and fall back to the edge node automatically when it can't connect. Uncheck to always play from the edge node.">
            <input type="checkbox" id="appP2P" checked>
            P2P
        </label>

        <button id="appStartBtn" title="Start" disabled>&#x25B6;</button>
        <button id="appExitBtn" title="Exit" disabled>&#x23F9;</button>
        <button id="appPauseVideoBtn" title="Pause Video" disabled>&#x23F8;</button>
        <button id="appPauseAudioBtn" title="Pause Audio" disabled>&#x23F8;</button>
        <button id="appMuteBtn" title="Unmute" disabled>&#x1F507;</button>
        <button id="appSnapshotBtn" title="Snapshot" disabled>&#x1F4F7;</button>
        <button id="appRecordBtn" title="Record 60s (WebM)" disabled>&#x23FA;</button>
        <button id="appFullscreenBtn" title="Fullscreen" disabled>&#x26F6;</button>
        <button id="appStatsBtn" title="Show / hide statistics" disabled>&#x1F4CA;</button>
    </div>
</div>

<div id="main-area">
    <div id="video-container">
        <div id="player"></div>
    </div>
</div>

<script type="module" src="app.js?v=20261113-1"></script>

</body>
</html>
